name: Client media and overview isolation
on:
  push:
    branches: [fix/tenant-media-overview-20261112]
jobs:
  tenant-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check dashboard/platform.mjs
      - run: node --check tests/tenant-media-overview.test.mjs
      - run: node --test tests/tenant-media-overview.test.mjs tests/platform-isolation.test.mjs tests/platform-proxy.test.mjs
