name: Tests and API smoke
on:
  push:
    branches: [main, feature/owner-call-scheduling-20261111]
  pull_request:
    branches: [main, feature/tenant-bulk-approvals-20261109]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Validate module syntax
        run: |
          node --check dashboard/db.mjs
          node --check dashboard/classifier.mjs
          node --check dashboard/runtime.mjs
          node --check dashboard/discovery.mjs
          node --check dashboard/osm-discovery.mjs
          node --check dashboard/automation-router.mjs
          node --check dashboard/production.mjs
          node --check dashboard/notifications.mjs
          node --check dashboard/studio-sync.mjs
          node --check dashboard/server.mjs
          node --check dashboard/call-scheduling.mjs
          node --check dashboard/waakg-bridge.mjs
          node --check dashboard/public/app.js
          node --input-type=module --check < dashboard/public/simple-app.js
          node --check dashboard/prospecting-search.mjs
          node --check dashboard/gosom-maps.mjs
          node --check dashboard/public/campaign-ui.js
          node --check dashboard/public/campaign-ui.mjs
          node --check dashboard/public/campaign-ui-state.mjs
          node --check dashboard/public/radar-ui.js
          node --check dashboard/radar.mjs
          node --check dashboard/campaign-package.mjs
          node --check dashboard/consecom-flow.mjs
          node --check dashboard/agent-bridge.mjs
          node --check dashboard/campaign-selection.mjs
          node --check dashboard/outreach-queue.mjs
          node --check dashboard/authorized-outreach.mjs
          node --check dashboard/queue-health.mjs
          node --check dashboard/lead-catalog.mjs
          node --check dashboard/decision-intelligence/engine.mjs
          node --check dashboard/decision-intelligence/learning.mjs
          node --check dashboard/google-places-index.mjs
          node --check dashboard/operation-timeouts.mjs
          node --check dashboard/private-restore.mjs
          node --check dashboard/import-legacy.mjs
          node --check preview/server.mjs
      - name: Start local API and verify JSON
        run: |
          node dashboard/server.mjs >/tmp/prospector.log 2>&1 &
          echo $! >/tmp/prospector.pid
          sleep 3
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3030/api/state)" = "403"
          curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -d '{"name":"CI internal operation","email":"ci@example.test","phone":"11999990001","password":"synthetic-ci-password"}' http://127.0.0.1:3030/api/platform/primary-client >/dev/null
          CLIENT_COOKIE=$(curl --fail --silent --show-error -D - -o /dev/null -X POST -H 'Content-Type: application/json' -d '{"identifier":"ci@example.test","password":"synthetic-ci-password"}' http://127.0.0.1:3030/api/platform/signin | sed -n 's/^Set-Cookie: \([^;]*\).*/\1/p' | tr -d '\r')
          test -n "$CLIENT_COOKIE"
          api() { curl -H "Cookie: $CLIENT_COOKIE" "$@"; }
          curl --fail --silent --show-error http://127.0.0.1:3030/conheca | grep -q 'id="auth-form"'
          curl --fail --silent --show-error http://127.0.0.1:3030/campaign-ui.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3030/campaign-ui.mjs >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3030/campaign-ui-state.mjs >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3030/campaign-ui.css >/dev/null
          api --fail --silent --show-error http://127.0.0.1:3030/api/agent-bridge/status | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const x=JSON.parse(s);if(!x.state)process.exit(1)})"
          api --silent --show-error -X POST -H 'Content-Type: application/json' -d '{"id":"default"}' http://127.0.0.1:3030/api/workflows/activate | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const x=JSON.parse(s);if(!/mídia|áudio|vídeo|Campanha/.test(x.error||''))process.exit(1);console.log('Activation guard smoke passed')})"
          api --fail --silent --show-error http://127.0.0.1:3030/api/outreach-queue | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{let a=JSON.parse(s);if(!('ready' in a)&&!('awaitingConsent' in a))process.exit(1)})"
          api --silent --show-error -X POST -H 'Content-Type: application/json' -d '{"text":"sim, pode mandar","context":"presentation_permission"}' http://127.0.0.1:3030/api/intelligence/test | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const a=JSON.parse(s);if(a.decision!=='YES'||!a.engine)process.exit(1)})"
          api --fail --silent --show-error http://127.0.0.1:3030/api/intelligence/status | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const a=JSON.parse(s);if(!Array.isArray(a.models))process.exit(1)})"
          api --fail --silent --show-error http://127.0.0.1:3030/api/catalog/summary | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const a=JSON.parse(s);if(!('total' in a)||!Array.isArray(a.cities))process.exit(1)})"
          api --fail --silent --show-error http://127.0.0.1:3030/api/catalog?limit=10 | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const a=JSON.parse(s);if(!Array.isArray(a.leads))process.exit(1)})"
          api --fail --silent --show-error http://127.0.0.1:3030/api/research/google-index | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const a=JSON.parse(s);if(!('keyConfigured' in a))process.exit(1)})"
          api --fail --silent --show-error http://127.0.0.1:3030/api/queue-health | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const a=JSON.parse(s);if(!a.reason||!a.initialToday||!('initialPending' in a))process.exit(1);console.log('Queue health smoke passed')})"
          api --fail --silent --show-error http://127.0.0.1:3030/api/state | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const x=JSON.parse(s);if(!Array.isArray(x.leads)||!Array.isArray(x.workflows)||!('activeCampaign' in x))process.exit(1);console.log('API smoke passed')})"
      - name: Show server output on failure
        if: failure()
        run: cat /tmp/prospector.log || true

  call-scheduling-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check scheduling module syntax
        run: |
          node --check dashboard/call-scheduling.mjs
          node --check dashboard/waakg-bridge.mjs
          node --check dashboard/server.mjs
          node --check dashboard/owner-approved-pitch.mjs
      - name: Test call scheduling without real WhatsApp sends
        run: node --test tests/call-scheduling*.test.mjs
