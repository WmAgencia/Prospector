name: Production access security smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public presentation and private operational access
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://prospector-operacional-production.up.railway.app
          PAGE=$(curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 20 "$BASE/access")
          echo "$PAGE" | grep -q "Não é necessário usuário ou senha"
          for attempt in $(seq 1 40); do
            LANDING=$(curl --silent --show-error --max-time 15 "$BASE/" || true)
            if echo "$LANDING" | grep -q 'id="auth-form"'; then break; fi
            sleep 3
          done
          echo "$LANDING" | grep -q 'id="auth-form"'
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$BASE/api/state")
          test "$STATUS" = "401"
          HEADERS=$(curl --silent --show-error -D - -o /dev/null "$BASE/api/state")
          if echo "$HEADERS" | grep -qi "^WWW-Authenticate: Basic"; then
            echo "Legacy Basic Auth still active"
            exit 1
          fi
          echo "Public landing online; operational API protected; no Basic Auth."
