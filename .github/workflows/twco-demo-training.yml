name: TWCO demo training and WhatsApp safety
on:
  push:
    branches: [test/twco-demo-training-20261113]
jobs:
  tw-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check training and one-shot activation
        run: |
          node --check dashboard/tw-demo-reply-guard.mjs
          node --check dashboard/tw-demo-training-child.mjs
          node --check dashboard/tw-demo-training-orchestrator.mjs
          node --check dashboard/server.mjs
          node --check dashboard/groq-sales-automation.mjs
          node --check tests/tw-demo-training-e2e.test.mjs
      - name: Simulate isolated TW training and authorized WhatsApp support
        run: node --test --test-concurrency=1 tests/tw-demo-training-e2e.test.mjs tests/tenant-inbound-support-e2e.test.mjs tests/tenant-guided-training-e2e.test.mjs tests/tenant-gateway-broker.test.mjs tests/platform-isolation.test.mjs
