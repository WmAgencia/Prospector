name: Kanban and portfolio voice focused checks
on:
  push:
    branches:
      - fix/kanban-scroll-pitch-audio-20261110
  pull_request:
    branches:
      - feature/tenant-bulk-approvals-20261109
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test two-card scroll and approved audio behavior
        run: |
          node --test tests/kanban-voice-regression.test.mjs tests/prospecting-owner-audio-pitch.test.mjs tests/consecom-owner-audio-script.test.mjs tests/overview-dimensions.test.mjs
      - name: Validate modules
        run: |
          node --input-type=module --check < dashboard/public/simple-app.js
          node --check dashboard/server.mjs
          node --check dashboard/prospecting-introduction.mjs
          node --check dashboard/portfolio-pitch-audio.mjs
          node --check dashboard/portfolio-pitch-voice-550.mjs
