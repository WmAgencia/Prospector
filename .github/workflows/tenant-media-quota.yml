name: Tenant media storage and abuse limits
on:
  push:
    branches: [fix/tenant-media-quota-20261112]
jobs:
  media-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check dashboard/server.mjs
      - run: node --check dashboard/tenant-media-quota.mjs
      - run: node --test tests/tenant-media-quota.test.mjs tests/tenant-media-overview.test.mjs tests/platform-isolation.test.mjs
