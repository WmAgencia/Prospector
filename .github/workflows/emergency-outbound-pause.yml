name: Emergency outbound pause
on:
  push:
    branches: [fix/emergency-pause-all-outgoing-20261111]
  pull_request:
    branches: [feature/tenant-bulk-approvals-20261109]
jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/emergency-pause-outbound.test.mjs
      - run: node --check dashboard/server.mjs
