name: Overview approach period reporting
on:
  push:
    branches:
      - feat/overview-approaches-period-filter-20261111
  pull_request:
    branches:
      - feature/tenant-bulk-approvals-20261109
jobs:
  approach-period:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate period and deduplicated send evidence
        run: node --test tests/overview-approaches-period.test.mjs tests/overview-dimensions.test.mjs
      - name: Verify syntax
        run: |
          node --check dashboard/server.mjs
          node --check dashboard/overview-approaches.mjs
          node --input-type=module --check < dashboard/public/simple-app.js
