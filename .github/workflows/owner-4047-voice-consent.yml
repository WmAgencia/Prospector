name: Confirm and recover Luciana 4047 voice consent
on:
  push:
    branches: [fix/4047-human-yes-owner-audio-20261112]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check dashboard/server.mjs
      - run: node --check dashboard/owner-proposal-interest.mjs
      - run: node --check dashboard/owner-4047-audio-rescue.mjs
      - run: node --test tests/owner-proposal-interest.test.mjs tests/owner-435-resume.test.mjs tests/approach-cadence.test.mjs
