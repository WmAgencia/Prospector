name: Client Maps and voice runtime validation
on:
  push:
    branches: [fix/tenant-maps-audio-runtime-20261112]
jobs:
  tenant-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check dashboard/platform.mjs
      - run: node --check tests/tenant-runtime-env.test.mjs
      - run: node --test tests/tenant-runtime-env.test.mjs tests/platform-isolation.test.mjs tests/tenant-prospecting-controls.test.mjs
